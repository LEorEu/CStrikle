services:
  cstrikle:
    build: .
    container_name: cstrikle
    restart: unless-stopped
    init: true
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # 玩家纠错反馈落盘(配合 .env 的 FEEDBACK_PATH=/data/feedback/feedback.jsonl)
      - ./feedback:/data/feedback
    security_opt:
      - no-new-privileges:true
    networks:
      - rag-net

networks:
  rag-net:
    external: true
    name: rag-stack_rag-net
