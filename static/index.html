<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FribergCS2 — 猜 CS 职业哥</title>
<link rel="icon" type="image/jpeg" href="/static/favicon.jpg">
<link id="theme-css" rel="stylesheet" href="/static/style.css">
<script>
/* 首屏换肤:在渲染前按本地偏好切样式表,避免闪一下旧皮肤 */
(function () {
  try {
    var v = localStorage.getItem("fcs2_ui") === "v2" ? "v2" : "v1";
    document.documentElement.dataset.ui = v;
    if (v === "v2")
      document.getElementById("theme-css").setAttribute("href", "/static/style2.css");
  } catch (e) {}
})();
</script>
</head>
<body>
<header>
  <h1 onclick="go('home')">FribergCS2<span class="sub">猜 CS 职业哥</span></h1>
  <div id="meta-info" class="meta"></div>
  <button id="ui-toggle" class="ui-toggle" type="button" onclick="toggleUi()"
    title="切换界面风格"></button>
</header>

<main>
  <!-- ==================== 首页 ==================== -->
  <section id="view-home" class="view home-view">
    <div class="mode-section-head">
      <div>
        <span>SELECT OPERATION</span>
        <h2>选择行动模式</h2>
      </div>
      <p>每日一题、无限练习，或者直接和朋友 / AI 对枪。</p>
    </div>
    <div class="mode-cards">
      <button class="card" type="button" data-index="01"
        data-eyebrow="DAILY // 每日一题" onclick="startDaily()">
        <h2>每日挑战</h2>
        <p>全球同一谜底,每天一题,常规难度。猜完复制战绩去嘲讽朋友。</p>
        <span class="card-cta">接受挑战 <b>→</b></span>
      </button>
      <button class="card" type="button" data-index="02"
        data-eyebrow="FREEPLAY // 自定义" onclick="showUnlimitedSetup()">
        <h2>无限模式</h2>
        <p>自定难度、赛区、年代,想玩几局玩几局。</p>
        <span class="card-cta">开始训练 <b>→</b></span>
      </button>
      <button class="card" type="button" data-index="03"
        data-eyebrow="VERSUS // 1V1" onclick="go('versus-lobby')">
        <h2>对战模式</h2>
        <p>开房间跟朋友对枪,或者跟会上网查资料、会喷垃圾话的 AI 打。</p>
        <span class="card-cta">进入大厅 <b>→</b></span>
      </button>
    </div>
  </section>

  <!-- ==================== 无限模式设置 ==================== -->
  <section id="view-unlimited-setup" class="view hidden">
    <h2>无限模式 · 赛前设置</h2>
    <div id="settings-unlimited"></div>
    <button class="primary" onclick="startUnlimited()">开始</button>
    <button onclick="go('home')">返回</button>
  </section>

  <!-- ==================== 单人对局 ==================== -->
  <section id="view-game" class="view hidden">
    <div class="game-head">
      <span id="game-mode-label"></span>
      <span id="game-remaining"></span>
      <span id="game-pool"></span>
    </div>
    <div class="guess-box">
      <input id="guess-input" placeholder="输入选手 ID，比如 s1mple…" autocomplete="off">
      <div id="suggest" class="suggest hidden"></div>
    </div>
    <div id="grid" class="grid"></div>
    <div id="game-result" class="result hidden"></div>
    <div class="row-btns">
      <button id="btn-again" class="primary hidden" onclick="startUnlimited()">再来一局</button>
      <button onclick="go('home')">回首页</button>
    </div>
  </section>

  <!-- ==================== 对战大厅 ==================== -->
  <section id="view-versus-lobby" class="view hidden">
    <h2>对战模式</h2>
    <label class="lobby-name">你的昵称
      <input id="lobby-name" value="" maxlength="20" placeholder="路人玩家">
    </label>
    <label class="streamer-toggle">
      <input type="checkbox" id="streamer-mode">
      <span><b>主播模式</b><small>隐藏对手 ID 和聊天内容</small></span>
    </label>
    <div class="lobby-grid">
      <div class="panel">
        <h3>创建房间</h3>
        <label class="chk"><input type="checkbox" id="vs-ai"> 和 AI 打(它会上网查资料还会喷你)
          <span id="vs-ai-note" class="dim hidden">(自定义难度不可用 AI)</span></label>
        <label id="ai-level-row" class="hidden">AI 强度
          <select id="ai-level">
            <option value="easy">下饭</option>
            <option value="normal" selected>普通</option>
            <option value="hard">作弊</option>
          </select>
        </label>
        <div id="settings-room"></div>
        <button class="primary" onclick="createRoom()">创建</button>
      </div>
      <div class="panel">
        <h3>加入房间</h3>
        <label>房间码 <input id="join-code" maxlength="4" placeholder="ABCD" style="text-transform:uppercase"></label>
        <button class="primary" onclick="joinRoom()">加入</button>
      </div>
      <div class="panel">
        <h3>随机匹配</h3>
        <p class="dim">自动配对一位同难度的路人对手 · 整局限时 2 分钟</p>
        <div class="mm-diff">
          <span class="seg mm-seg">
            <button data-v="top20">Top20</button>
            <button data-v="easy">简单</button>
            <button data-v="medium" class="on">常规</button>
            <button data-v="hard">困难</button>
          </span>
        </div>
        <button id="btn-match" class="primary" onclick="startMatch()">开始匹配</button>
        <div id="mm-status" class="mm-status hidden">
          <span class="mm-dot"></span>匹配中,等待对手…
          <button class="linklike" onclick="cancelMatch()">取消</button>
        </div>
      </div>
    </div>
    <button onclick="go('home')">返回</button>
  </section>

  <!-- ==================== 对战房间 ==================== -->
  <section id="view-room" class="view hidden">
    <div class="game-head">
      <span>房间 <b id="room-code"></b></span>
      <span id="room-status"></span>
      <span id="room-remaining"></span>
    </div>
    <div id="turn-timer" class="turn-timer hidden"></div>
    <div class="room-layout">
      <div class="room-main">
        <div class="guess-box">
          <input id="room-guess-input" placeholder="输入选手 ID…" autocomplete="off">
          <div id="room-suggest" class="suggest hidden"></div>
        </div>
        <div id="room-grid" class="grid"></div>
        <div id="room-result" class="result hidden"></div>
        <div id="opp-reveal-main"></div>
        <div class="row-btns">
          <button id="btn-rematch" class="primary hidden" onclick="roomRematch()">再来一局</button>
          <button id="btn-transcript" class="primary hidden" onclick="showTranscript()">查看 AI 决策回放</button>
          <button onclick="leaveRoom()">离开房间</button>
        </div>
      </div>
      <div class="room-side">
        <div class="panel opp-panel">
          <h3 id="opp-name">等待对手…</h3>
          <div id="ai-status" class="ai-status hidden"></div>
          <div id="opp-grid" class="mini-grid"></div>
          <div id="opp-remaining" class="dim"></div>
        </div>
        <div class="panel chat-panel">
          <div class="chat-head">
            <div>
              <h3>全体聊天 · ALL CHAT</h3>
              <span id="chat-privacy-note" class="chat-privacy-note hidden">主播模式已隐藏</span>
            </div>
            <button id="chat-reveal" class="chat-reveal hidden" type="button"
              onclick="toggleStreamerReveal()" aria-label="临时显示对手和聊天内容"
              aria-pressed="false" title="临时显示对手和聊天内容">
              <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
                <circle cx="12" cy="12" r="2.8"/>
              </svg>
              <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m3 3 18 18M10.4 6.2A10.5 10.5 0 0 1 12 6c6 0 9.5 6 9.5 6a15.8 15.8 0 0 1-2.2 2.8M6.1 6.2C3.8 8 2.5 12 2.5 12s3.5 6 9.5 6c1 0 1.9-.2 2.8-.5M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
              </svg>
            </button>
          </div>
          <div id="chat-log" class="chat-log"></div>
          <div class="chat-input">
            <input id="chat-text" placeholder="说点什么…" maxlength="200">
            <button onclick="sendChat()">发送</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- AI 决策回放弹窗 -->
<div id="modal" class="modal hidden" onclick="if(event.target===this)this.classList.add('hidden')">
  <div class="modal-body">
    <div class="modal-head">
      <h2>AI 决策回放 <span id="transcript-model" class="dim"></span></h2>
      <button aria-label="关闭" onclick="document.getElementById('modal').classList.add('hidden')">×</button>
    </div>
    <p class="transcript-note">回看 AI 每一轮怎样缩小范围、为什么会选这个人。</p>
    <div id="transcript-body"></div>
  </div>
</div>

<!-- 选手信息纠错弹窗 -->
<div id="fb-modal" class="modal hidden" onclick="if(event.target===this)this.classList.add('hidden')">
  <div class="modal-body fb-body">
    <div class="modal-head">
      <h2>选手信息纠错</h2>
      <button aria-label="关闭" onclick="document.getElementById('fb-modal').classList.add('hidden')">×</button>
    </div>
    <p class="dim">纠错对象:<span id="fb-player"></span></p>
    <textarea id="fb-text" rows="4" maxlength="500"
      placeholder="例:他现在是 XX 战队现役,不是自由身 / 位置应该是狙击手 / 国籍写错了…"></textarea>
    <div class="row-btns">
      <button class="primary" onclick="sendFeedback()">提交反馈</button>
    </div>
  </div>
</div>

<!-- 已猜选手资料弹窗 -->
<div id="player-modal" class="modal hidden" role="dialog" aria-modal="true"
  aria-labelledby="player-profile-title" onclick="if(event.target===this)closePlayerProfile()">
  <div class="modal-body player-profile-body">
    <div class="modal-head">
      <div>
        <span class="profile-kicker">选手资料</span>
        <h2 id="player-profile-title">PLAYER PROFILE</h2>
      </div>
      <button id="player-profile-close" type="button" aria-label="关闭选手资料"
        onclick="closePlayerProfile()">×</button>
    </div>
    <div id="player-profile-content"></div>
  </div>
</div>

<!-- 胜负结算弹窗 -->
<div id="end-overlay" class="end-overlay hidden">
  <div class="end-stage">
    <div id="end-verdict" class="end-verdict"></div>
    <div id="end-sub" class="end-sub"></div>
    <div id="end-card" class="end-card"></div>
    <div id="end-btns" class="end-btns"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/static/countries.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
